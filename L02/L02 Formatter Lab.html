<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Formatter letter </title>
    </head>
    <body>
            <b> this is blod text</b>
            <strong> this is also blond text</strong>
            
            <i> this is italic text</i><br>
            <em> this is also italic text</em> <br><br>

            <mark> this is highlighted text</mark>
            
            <small>this is small text</small>
            
            <del> this is strike-through text</del>
            
            math formula*<sup>2</sup>.<br>
            chemistry Formula CO <sub>2</sub> <br> <br>
            <blockquote> 
                this is blockquote to quote some sentences from other sources
            </blockquote>
    </body>
</html>
