<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> My Color Card</title>
        <!--internal CSS-->
        <style>
            /* Universal Selector - applies to everything on the page*/
            * {
                font-size: 16px;
            }

            /*Element Sector*/
            body{
                background-color:rgb(206, 216, 221);
            }

            h1{
                color:rgb(62, 62, 206);
            }

            h2{
                color:rgb(39, 43, 44);
            }

            p{
                color:rgb(85, 69, 180);
            }

            /*Class Selector */
            .my-detail {
                color:rgb(69, 82, 156);
                font-weight: bold;
            }

            /*ID Selector*/
            #my-card {
                background-color:rgb(178, 191, 201);
            }
        </style>
    </head>
    <body>
        <h1>My Color Card</h1>

        <!--Inline CSS: Add style="color:____; " inside this p tag-->
        <p style="color:whitesmoke;">
            Hi ! This is my very own webpage.
        </p>

        <div id="my-card">
            <h2>About Me</h2>

            <p class="my-detail"> My name is Shaan-e-iram Sheikh.</p>
            <p class="my-detail">my favourite color is red.</p>
            <p class="my-detail"> My favourite subject is Maths.</p>
            <p class="my-detail"> Myfourite food is pasta.</p>

        </div>

        <h2>My Fourite Things</h2>
        <p> My Favourite animal is a cat</p>
        <p> My Favourite sport is skating</p>
        <p> My Favourite movie is Doreamon </p>
    </body>
</html>
